<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Poppins:wght@300;400&display=swap"
        rel="stylesheet">

    <title>Perfume Finder</title>

    <style>
        @font-face {
            font-family: 'BentonSans-Regular';
            src: url('fonts/BentonSans-Regular.woff') format('woff');
            font-style: normal;
            font-weight: normal;
        }

        @font-face {
            font-family: 'bentonsansmedium';
            src: url('fonts/bentonsans_medium-webfont.woff2') format('woff2'),
                url('fonts/bentonsans_medium-webfont.woff') format('woff');
            font-weight: normal;
            font-style: normal;
        }

        @font-face {
            font-family: 'bentonsansbook_italic';
            src: url('fonts/bentonsans_book_italic-webfont.woff2') format('woff2'),
                url('fonts/bentonsans_book_italic-webfont.woff') format('woff');
            font-weight: normal;
            font-style: normal;
        }

        @font-face {
            font-family: 'sackers_gothic_stdlight';
            src: url('fonts/sackers_gothic_light-webfont.woff2') format('woff2'),
                url('fonts/sackers_gothic_light-webfont.woff') format('woff');
            font-weight: normal;
            font-style: normal;
        }

        @font-face {
            font-family: 'sackers_gothic_stdmedium';
            src: url('fonts/sackers_gothic_medium-webfont.woff2') format('woff2'),
                url('fonts/sackers_gothic_medium-webfont.woff') format('woff');
            font-weight: normal;
            font-style: normal;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'BentonSans-Regular';
            background: transparent;
            color: #3a2a17;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* main */
        .main {
            padding: 3px;
            background: linear-gradient(135deg, #b98b3e 0%, #f3e3ad 35%, #d8ad55 65%, #8a611f 100%);
            border-radius: 18px;
        }

        /* CONTAINER */
        .container {
            position: relative;
            width: 100%;
            max-width: 420px;
            background: linear-gradient(160deg, #ffffff 0%, #f7ecd2 45%, #e9cd8f 100%);
            border-radius: 18px;
            padding: 25px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            text-align: center;
            animation: fadeIn 0.6s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* CLOSE */
        .close {
            position: absolute;
            right: 20px;
            top: 15px;
            font-size: 20px;
            cursor: pointer;
        }

        /* LANGUAGE SWITCHER */
        #languageSwitcher {
            /* position: absolute;
  left: 20px;
  top: 15px; */
            padding: 5px 15px;
            border-radius: 5px;
            border: 1px solid #c9a98c;
            background: #f3e3d4;
            color: #3a2a17;
            font-size: 14px;
            margin-bottom: 20px;
        }

        /* TITLE */
        .title {
            font-family: 'BentonSans-Regular';
            font-size: 20px;
            letter-spacing: 2px;
        }

        .subtitle {
            font-size: 12px;
            text-transform: capitalize;
            font-weight: 300;
            /* margin-bottom:20px;
  margin-top: 20px; */
        }

        /* PROGRESS BAR */
        /* STEPS WRAPPER */
        .steps {
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 15px 0 25px;
        }

        /* EACH STEP */
        .step {
            text-align: center;
            font-size: 11px;
            color: #a08a6a;
            transition: 0.3s;
        }

        /* CIRCLE */
        .step span {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            border: 1px solid #c9a98c;
            margin: auto;
            margin-bottom: 5px;
            font-size: 12px;
            background: #f3e3d4;
        }

        /* ACTIVE STEP */
        .step.active span {
            background: #3a2a17;
            color: #fff;
            border-color: #3a2a17;
            box-shadow: 0 0 10px rgba(80, 55, 5, 0.4);
        }

        .step.active p {
            color: #3a2a17;
            font-weight: 500;
        }

        /* LINE BETWEEN */
        .line {
            width: 30px;
            height: 1px;
            background: #c9a98c;
            margin: 0 5px;
        }

        /* RESPONSIVE */
        @media(max-width:480px) {
            .line {
                width: 15px;
            }
        }


        /* DREAM SECTION */
        .dream-title {
            font-family: 'BentonSans-Regular';
            font-size: 22px;
            margin-bottom: 5px;
        }

        .dream-sub {
            font-size: 13px;
            margin-bottom: 10px;
        }

        /* INPUT */

        /* ===== INPUT ===== */
        .form-container {
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }

        .input-wrapper {
            margin-bottom: 18px;
        }

        .input-group {
            display: flex;
            align-items: center;
            border-radius: 30px;
            padding: 12px 18px;
            border: 1px solid #3a2a17;
            background: #fff;
            transition: 0.3s;
        }

        .input-group.error {
            border-color: #b00020;
        }

        .input-group input,
        .input-group select {
            border: none;
            outline: none;
            background: #fff;
            font-size: 16px;
            width: 100%;
            color: #5a3d1e;
        }

        .input-group select {
            width: 60px;
            margin: 0 10px 0 0;
        }

        .input-group span {
            margin-right: 10px;
            font-size: 15px;
            color: #5a3d1e;
        }

        .error-message {
            font-size: 13px;
            color: #b00020;
            margin-top: 6px;
            margin-left: 18px;
            display: none;
        }

        .submit-btn {
            /* width:100%;
    padding:14px;
    border-radius:30px;
    border:none;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
    transition:0.3s; */
        }

        .submit-btn:disabled {
            background: #cbb79f;
            color: #7a5a34;
            cursor: not-allowed;
            opacity: 0.7;
        }

        .submit-btn.enabled {
            background: linear-gradient(135deg, #f5d7a5, #c9973e, #f5d7a5);
            color: #4a2e0f;
            box-shadow: 0 0 15px rgba(201, 151, 62, 0.5);
        }

        @media(max-width:480px) {
            .form-container {
                padding: 15px;
            }
        }

        /* BUTTON */
        .btn {
            margin-top: 20px;
            width: 100%;
            background: #fff;
            color: #3a2a17;
            font-family: 'bentonsansmedium';
            font-weight: 700;
            font-size: 13px;
            letter-spacing: .05em;
            text-decoration: none;
            text-transform: uppercase;
            padding: 16px 44px;
            border-radius: 10px;
            border: 2px solid #3a2a17;
            cursor: pointer;
            transition: transform .15s ease, box-shadow .15s ease;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(0, 0, 0, .15);
        }

        .close-btn {
      position: relative;
      top: -40px;
      right: -3px;
      color: var(--brown-dark);
      font-family: 'BentonSans-Regular';
      font-weight: 600;
      font-size: 12px;
      letter-spacing: .15em;
      text-transform: uppercase;
      border: none;
      padding: 10px 22px 30px 22px;
      border-radius: 8px 8px 0 0;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0, 0, 0, .12);
      background: linear-gradient(135deg, #f4e6bd, #caa14b);
      float: right;
    }

    /* hover effect */
    .close-btn:hover {
      filter: brightness(1.05);
    }

        /* ERROR */
        .error {
            color: red;
            font-size: 12px;
            margin-top: 10px;
        }

        @keyframes fadeOut {
            from {
                opacity: 1;
                transform: scale(1);
            }

            to {
                opacity: 0;
                transform: scale(0.8);
            }
        }
    </style>
</head>

<body>

    <main class="main">

         <button class="close-btn" type="button" data-i18n="close">close</button>

        <div class="container">

            <!-- LANGUAGE SWITCHER -->
            <select id="languageSwitcher">
                <option value="en">English</option>
                <option value="ar">العربية</option>
            </select>

            <!-- TITLE -->
            <div class="title" data-i18n="discover_your_perfume">DISCOVER YOUR PERFUME</div>

            <!-- Progress Bar -->
            <div class="steps">

                <div class="step">
                    <span>1</span>
                    <p data-i18n="dream">Dream</p>
                </div>

                <div class="line"></div>

                <div class="step">
                    <span>2</span>
                    <p data-i18n="discover">Discover</p>
                </div>

                <div class="line"></div>

                <div class="step active">
                    <span>3</span>
                    <p data-i18n="gift">Gift</p>
                </div>

            </div>

            <div class="dream-title" data-i18n="gift_voucher">Gift Voucher</div>
            <div class="dream-sub" data-i18n="complimentary_voucher">Complimentary 12ml EDP</div>
            <div class="subtitle" data-i18n="collect_your_gift">collect your GIFT from any of our Boutiques. </div>
            <div class="subtitle" data-i18n="unique_reservation">This gift is uniquely reserved for you.</div>

            <div class="dream-sub" style="margin-top: 10px;" data-i18n="terms_and_conditions">T&C apply.</div>

            <div class="form-container">

                <!-- Name -->
                <div class="input-wrapper">
                    <div class="input-group" id="nameGroup">
                        <span>👤</span>
                        <input type="text" id="name" placeholder="Enter your name" data-i18n-placeholder="enter_name">
                    </div>
                    <div class="error-message" id="nameError" data-i18n="name_error">
                        Name must be at least 3 characters.
                    </div>
                </div>

                <!-- Phone -->
                <div class="input-wrapper">
                    <div class="input-group" id="phoneGroup">
                        <span>📞</span>
                        <!-- <select id="isd">
                <option value="+966">+966</option>
                <option value="+971">+971</option>
                <hr>
            </select> -->
                        <select id="isd"></select>

                        <input type="tel" id="phone" placeholder="Enter phone number"
                            data-i18n-placeholder="enter_phone">
                    </div>
                    <div class="error-message" id="phoneError" data-i18n="phone_error">
                        Enter valid phone number (7–15 digits).
                    </div>
                </div>

                <!-- Email -->
                <div class="input-wrapper">
                    <div class="input-group" id="emailGroup">
                        <span>✉</span>
                        <input type="email" id="email" placeholder="Enter your email"
                            data-i18n-placeholder="enter_email">
                    </div>
                    <div class="error-message" id="emailError" data-i18n="email_error">
                        Enter a valid email address.
                    </div>
                    <!-- API error message -->
                    <div class="error-message" id="emailApiError"></div>
                </div>

                <button id="submitBtn" class="submit-btn btn btn-primary" data-i18n="collect_gift" disabled>
                    Collect Gift Voucher
                </button>

            </div>

            <!-- <button class="btn" onclick="submitForm()">Discover My Perfume</button> -->

        </div>

    </main>


    <script>
        document.addEventListener("DOMContentLoaded", function () {

            // ==========================
            // GET DATA FROM URL
            // ==========================

            const params = new URLSearchParams(window.location.search);
            const dreamId = parseInt(params.get("dreamId")) || 0;
            const userDream = params.get("userDream") || "";
            let recommendationData = JSON.parse(sessionStorage.getItem("recommendationData")) || {};
            const category = params.get("Gender") || recommendationData.gender || "";

            console.log("Dream ID:", dreamId);
            console.log("User Dream:", userDream);

            async function refreshRecommendationForLanguage() {
                const currentLang = getSavedLanguage();

                if (
                    userDream &&
                    category &&
                    recommendationData.language !== currentLang
                ) {
                    const response = await fetch("https://recommendation.mansamworld.com/recommend", {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            query: userDream,
                            gender: category,
                            language: currentLang
                        })
                    });

                    if (response.ok) {
                        recommendationData = await response.json();
                        sessionStorage.setItem("recommendationData", JSON.stringify(recommendationData));
                    }
                }

                return recommendationData;
            }

            refreshRecommendationForLanguage().catch(error => {
                console.error("Recommendation language refresh failed:", error);
            });

            // ==========================
            // FORM ELEMENTS
            // ==========================

            const nameInput = document.getElementById("name");
            const phoneInput = document.getElementById("phone");
            const emailInput = document.getElementById("email");
            const isdSelect = document.getElementById("isd");

            const nameGroup = document.getElementById("nameGroup");
            const phoneGroup = document.getElementById("phoneGroup");
            const emailGroup = document.getElementById("emailGroup");

            const nameError = document.getElementById("nameError");
            const phoneError = document.getElementById("phoneError");
            const emailError = document.getElementById("emailError");
            const emailApiError = document.getElementById("emailApiError"); // ✅ NEW

            const submitBtn = document.getElementById("submitBtn");

            // ==========================
            // VALIDATION FUNCTION
            // ==========================

            function validateForm() {

                let valid = true;

                // Reset API error when validating
                emailApiError.style.display = "none";
                emailInput.classList.remove("input-error");

                // Name
                if (nameInput.value.trim().length < 3) {
                    nameError.style.display = "block";
                    nameGroup.classList.add("error");
                    valid = false;
                } else {
                    nameError.style.display = "none";
                    nameGroup.classList.remove("error");
                }

                // Phone
                if (!/^[0-9]{7,15}$/.test(phoneInput.value.trim())) {
                    phoneError.style.display = "block";
                    phoneGroup.classList.add("error");
                    valid = false;
                } else {
                    phoneError.style.display = "none";
                    phoneGroup.classList.remove("error");
                }

                // Email (optional)
                if (emailInput.value.trim() !== "") {
                    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(emailInput.value.trim())) {
                        emailError.style.display = "block";
                        emailGroup.classList.add("error");
                        valid = false;
                    } else {
                        emailError.style.display = "none";
                        emailGroup.classList.remove("error");
                    }
                } else {
                    emailError.style.display = "none";
                    emailGroup.classList.remove("error");
                }

                submitBtn.disabled = !valid;
                return valid;
            }

            // ==========================
            // POST API CALL
            // ==========================

            async function submitUserDream() {

                if (!validateForm()) return;

                const languageCode = getLanguageCode();

                const recommendationData = await refreshRecommendationForLanguage();

                const storytelling = recommendationData?.storytelling || {};

                const dreamNarrative = [
                    storytelling?.opening,
                    storytelling?.emotional_bridge,
                    storytelling?.perfume_reveal?.headline,
                    storytelling?.perfume_reveal?.narrative,
                    storytelling?.perfume_reveal?.wearing_effect
                ]
                    .filter(Boolean)
                    .join("\n\n");

                const payload = {
                    emailId: emailInput.value.trim(),
                    telephoneNo: isdSelect.value + phoneInput.value.trim(),
                    userName: nameInput.value.trim(),
                    dreamId: recommendationData.dream_id || "",
                    dreamName: recommendationData.dream_name || "",
                    userDream: userDream || "",
                    dreamNarrative: dreamNarrative,
                    productId: recommendationData.product_id || "",
                    productName: recommendationData?.recommended_perfume?.name || "",
                    languageCode: languageCode
                };

                console.log("POST Payload:", payload);

                try {

                    submitBtn.disabled = true;
                    submitBtn.setAttribute("data-i18n", "submitting");
                    submitBtn.innerText = translate("submitting", "Submitting...");

                    const response = await fetch(
                        `https://ae.mansamworld.com/api/public/userdreams?languageCode=${languageCode}`,
                        {
                            method: "POST",
                            headers: {
                                "Content-Type": "application/json",
                                "Accept": "application/json"
                            },
                            body: JSON.stringify(payload)
                        }
                    );

                    // RAW RESPONSE CHECK
                    const responseText = await response.text();

                    console.log("RAW API RESPONSE:", responseText);

                    let result = {};

                    try {
                        result = responseText ? JSON.parse(responseText) : {};
                    } catch (jsonError) {
                        console.error("JSON Parse Error:", jsonError);
                        throw new Error("Invalid JSON response from server");
                    }

                    // ==========================
                    // HANDLE API ERRORS
                    // ==========================

                    if (!response.ok) {

                        if (result.message === "user.dream.exist") {

                            emailApiError.innerText =
                                translate("email_exists", "Your email ID already exists.");

                            emailApiError.style.display = "block";

                            emailInput.classList.add("input-error");

                            return;
                        }

                        throw new Error(
                            result.message || "Something went wrong"
                        );
                    }

                    // ==========================
                    // SUCCESS CASE
                    // ==========================

                    console.log("API Success Gift Data:", JSON.stringify(result));

                    sessionStorage.setItem("giftData", JSON.stringify(result));

                    // delay redirect so response visible in network tab
                    setTimeout(() => {
                        window.location.href = "voucher.html";
                    }, 1500);

                } catch (error) {

                    console.error("API Error:", error);

                    alert(error.message || translate("failed_submit_dream", "Failed to submit dream."));

                } finally {

                    submitBtn.disabled = false;
                    submitBtn.setAttribute("data-i18n", "collect_gift");
                    submitBtn.innerText = translate("collect_gift", "Collect Gift Voucher");
                }
            }
            // ==========================
            // EVENTS
            // ==========================

            nameInput.addEventListener("input", validateForm);
            phoneInput.addEventListener("input", validateForm);
            emailInput.addEventListener("input", () => {
                emailApiError.style.display = "none"; // Reset API error while typing
                validateForm();
            });

            submitBtn.addEventListener("click", function (e) {
                e.preventDefault();
                submitUserDream();
            });

            // ==========================
            // ISD API CALL
            // ==========================

            async function fetchISD() {

                try {

                    const response = await fetch(
                        "https://ae.mansamworld.com/api/public/isd"
                    );

                    if (!response.ok) {
                        throw new Error("Failed to fetch ISD codes");
                    }

                    const isdData = await response.json();

                    isdSelect.innerHTML = "";

                    // +966 default
                    const option966 = document.createElement("option");
                    option966.value = "+966";
                    option966.textContent = "+966";
                    option966.selected = true;
                    isdSelect.appendChild(option966);

                    // +971
                    const option971 = document.createElement("option");
                    option971.value = "+971";
                    option971.textContent = "+971";
                    isdSelect.appendChild(option971);

                    // Separator line
                    const separator = document.createElement("option");
                    separator.disabled = true;
                    separator.textContent = "────────────";
                    isdSelect.appendChild(separator);

                    if (!isdData || isdData.length === 0) return;

                    // Dynamic options
                    isdData.forEach(item => {

                        if (item.isdCode === "+966" || item.isdCode === "+971") return;

                        const option = document.createElement("option");
                        option.value = item.isdCode;
                        option.textContent = item.isdCode;
                        isdSelect.appendChild(option);

                    });

                } catch (error) {
                    console.error("Error fetching ISD codes:", error);
                }
            }

            fetchISD();

        });

         // *------------- Close button functionality -------------*
    const closeBtn = document.querySelector('.close-btn');
    closeBtn.addEventListener('click', () => {
       console.log("close parent modal");
       
      window.parent.postMessage({
        action: 'closeModal'
       }, '*');

    });



    </script>
    <script src="js/i18n.js"></script>
<script src="js/chatbot.js?v=20260910-explicit-panel-toggle"></script>
</body>

</html>
